# ============================================================================
# PPMI Multimodal Parkinson's Progression Prediction — Phase 1 Configuration
# ============================================================================
# All paths are relative to project root. Never hardcode paths in source code.

seed: 42

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  raw: data/raw
  mri_raw: data/raw/mri
  processed: data/processed
  embeddings: data/embeddings
  results: outputs/results
  figures: outputs/figures
  models: outputs/models
  logs: outputs/logs

# ---------------------------------------------------------------------------
# Embedding dimensions per modality
# ---------------------------------------------------------------------------
embedding_dims:
  clinical: 32
  mri: 64
  pet: 16
  genetic: 32
  fused: 144  # sum of above

# ---------------------------------------------------------------------------
# MRI processing
# ---------------------------------------------------------------------------
# mri:
#   # 'freesurfer' - real PPMI FreeSurfer regional volumes (no NIfTIs needed)
#   # 'nifti'      - Schaefer-100 parcellation of T1w scans (must be MNI-space)
#   # 'synthetic'  - Gaussian noise; reproduces the pre-real-MRI results only
#   source: freesurfer

#   # --- freesurfer source ---
#   freesurfer_csv: data/raw/mri/FreeSurfer_MRI_Volumes.csv
#   freesurfer_visit: BL
#   normalize_by_icv: true    # divide volumes by EstimatedTotalIntraCranialVol

#   # --- nifti source ---
#   n_rois: 100               # Schaefer atlas parcels
#   nifti_space: mni          # 'mni' = already normalised. 'native' is refused:
#                             # the atlas is MNI-space, so parcels would land on
#                             # the wrong anatomy without registration.

#   # Extracted features are cached here and reused until the inputs change.
#   cache: data/processed/mri_features.parquet

# ---------------------------------------------------------------------------
# MRI processing
# ---------------------------------------------------------------------------
mri:
  # Primary MRI representation for the paper:
  # PPMI FreeSurfer-derived structural MRI measurements.
  #
  # No raw DICOM/NIfTI download is required for the primary experiment.
  source: freesurfer

  freesurfer_csv: data/raw/mri/FreeSurfer_MRI_Volumes.csv
  freesurfer_visit: BL

  # Correct for subject head size before train-only standardization.
  normalize_by_icv: true

  # -------------------------------------------------------------------------
  # Anatomy-informed MRI graph
  # -------------------------------------------------------------------------
  #
  # These are regional FreeSurfer measurements that become graph nodes.
  # The graph topology is fixed and contains no labels/targets.
  #
  # All other FreeSurfer measurements remain available as global MRI
  # measurements and are encoded by the MRI global-feature MLP.
  graph_features:
    - Brain_Stem
    - Optic_Chiasm

    - Left_Lateral_Ventricle
    - Right_Lateral_Ventricle
    - Left_Inf_Lat_Vent
    - Right_Inf_Lat_Vent
    - 3rd_Ventricle
    - 4th_Ventricle
    - 5th_Ventricle
    - Left_choroid_plexus
    - Right_choroid_plexus

    - Left_Cerebellum_Cortex
    - Right_Cerebellum_Cortex
    - Left_Cerebellum_White_Matter
    - Right_Cerebellum_White_Matter

    - Left_Amygdala
    - Right_Amygdala
    - Left_Accumbens_area
    - Right_Accumbens_area
    - Left_Caudate
    - Right_Caudate
    - Left_Hippocampus
    - Right_Hippocampus
    - Left_Pallidum
    - Right_Pallidum
    - Left_Putamen
    - Right_Putamen
    - Left_Thalamus
    - Right_Thalamus
    - Left_VentralDC
    - Right_VentralDC

    - CC_Anterior
    - CC_Mid_Anterior
    - CC_Central
    - CC_Mid_Posterior
    - CC_Posterior

  # Hidden dimension inside the MRI GNN.
  gnn_hidden_dim: 64

  # NIfTI remains available as a future secondary experiment.
  n_rois: 100
  nifti_space: mni

  # Cache of the processed FreeSurfer table.
  cache: data/processed/mri_features.parquet

# ---------------------------------------------------------------------------
# Cross-validation (baselines)
# ---------------------------------------------------------------------------
cv:
  n_splits: 5
  stratify_on: diagnosis

# ---------------------------------------------------------------------------
# Subject-level data split (leak-free: fit statistics on train only)
# ---------------------------------------------------------------------------
split:
  val_fraction: 0.15    # used for round-by-round monitoring + early stopping
  test_fraction: 0.15   # evaluated EXACTLY ONCE, after training completes
  stratify: true        # stratify on diagnosis so PD/HC ratios match

# ---------------------------------------------------------------------------
# Fed-PhenoGraft federated training
# ---------------------------------------------------------------------------
# training:
#   num_clients: 4
#   num_rounds: 30
#   local_epochs: 2
#   batch_size: 32
#   lr: 1.0e-3
#   weight_decay: 1.0e-4        # L2 regularization (AdamW)
#   hsic_weight: 0.1
#   cls_weight: 0.3             # PD-vs-HC classification loss weight (multitask)
#   grad_clip: 1.0
#   early_stopping_patience: 5  # rounds without val-CCC improvement
#   # Client partitioning: 'site' uses real PPMI acquisition sites when a
#   # Center-Subject list CSV is in data/raw (falls back to dirichlet otherwise);
#   # 'dirichlet' simulates non-IID cross-site heterogeneity via label-skew;
#   # 'iid' is the original random-shard split.
#   partition: dirichlet
#   dirichlet_alpha: 0.5        # lower alpha = more heterogeneous clients
training:
  num_clients: 4
  num_rounds: 30

  # Start with one local epoch to reduce client overfitting.
  local_epochs: 1

  batch_size: 32

  # Slightly more conservative learning rate for the GNN.
  lr: 5.0e-4

  # Stronger regularization than the original configuration.
  weight_decay: 3.0e-4

  grad_clip: 1.0
  early_stopping_patience: 5

  partition: dirichlet
  dirichlet_alpha: 0.5

model:
  embed_dim: 32
  num_heads: 4
  # dropout: 0.3
  dropout: 0.35

loss:
  ccc_weight: 2000.0
  hsic_weight: 0.0
  cls_weight: 0.0

# ---------------------------------------------------------------------------
# Statistical rigor: bootstrap CIs, multi-seed runs, paired significance test
# ---------------------------------------------------------------------------
evaluation:
  n_bootstrap: 1000           # bootstrap resamples for 95% CIs
  # num_seeds: 3                # independent Fed-PhenoGraft training runs (mean ± std)
  num_seeds: 3              # independent Fed-PhenoGraft training runs (mean ± std)

# ---------------------------------------------------------------------------
# Ablation suite (each variant retrained with the same protocol)
# ---------------------------------------------------------------------------
ablation:
  enabled: true
  num_rounds: 20              # shorter budget per ablation run
  early_stopping_patience: 3

# ---------------------------------------------------------------------------
# Target variables
# ---------------------------------------------------------------------------
target:
  # 'delta'    → predict UPDRS-III CHANGE from baseline to regression_visit
  #              (progression — harder, clinically more meaningful, avoids
  #              baseline-score autocorrelation dominating the metric)
  # 'absolute' → predict the raw UPDRS-III score at regression_visit
  mode: delta
  regression: updrs_iii_v04       # UPDRS-III score at year 2 (V04)
  classification: diagnosis       # PD vs HC binary label
  regression_visit: V04
  baseline_visit: BL

# ---------------------------------------------------------------------------
# Clinical features (from UPDRS + demographics)
# ---------------------------------------------------------------------------
clinical:
  updrs_cols:
    - updrs_i
    - updrs_ii
    - updrs_iii
    - updrs_iii_a
    - updrs_iv
  extra_behavioral:
    - moca
    - tremor
    - pigd
    - se_adl
    - epworth
    - gds
    - rbd
    - scopa_aut
    - semantic_fluency
    - symbol_digit
    - hvlt_recall
    - hvlt_recognition
    - hvlt_retention
    - lns
    - stai_state
    - stai_trait
    - upsit
  demographic_cols:
    - age
    - gender
    - education

# ---------------------------------------------------------------------------
# PET / DaTscan features
# ---------------------------------------------------------------------------
pet:
  raw_cols:
    - caudate_r
    - caudate_l
    - putamen_r
    - putamen_l
  epsilon: 1.0e-8  # avoid division by zero in asymmetry

# ---------------------------------------------------------------------------
# Genetic features
# ---------------------------------------------------------------------------
genetic:
  target_genes:
    - LRRK2
    - GBA
    - SNCA
    - PINK1
    - PARK2
    - APOE
  explicit_features:
    - n_variants
    - lrrk2_positive
    - gba_positive

# ---------------------------------------------------------------------------
# Autoencoder hyperparameters
# ---------------------------------------------------------------------------
autoencoder:
  clinical:
    hidden_dims: [128, 64]
    bottleneck: 32
    dropout: 0.2
    lr: 0.001
    epochs: 100
    patience: 10
    batch_size: 64
  mri:
    hidden_dims: [256, 128]
    bottleneck: 64
    dropout: 0.2
    lr: 0.001
    epochs: 100
    patience: 10
    batch_size: 32
    l1_lambda: 0.001  # sparse penalty on bottleneck

# ---------------------------------------------------------------------------
# Baseline model hyperparameter grids
# ---------------------------------------------------------------------------
models:
  random_forest:
    n_estimators: 200
    param_grid:
      max_depth: [5, 10, null]
      min_samples_split: [2, 5]

  xgboost:
    n_estimators: 300
    early_stopping_rounds: 20
    param_grid:
      learning_rate: [0.01, 0.1]
      max_depth: [3, 6]

  svm:
    param_grid:
      C: [0.1, 1, 10, 100]
      gamma: ['scale', 'auto']

  ridge:
    alphas: [0.01, 0.1, 1.0, 10.0, 100.0]

  mlp:
    hidden_dims: [256, 128, 64]
    dropout: 0.3
    lr: 0.001
    epochs: 200
    patience: 10
    batch_size: 64

  lightgbm:
    param_grid:
      num_leaves: [31, 63]
      learning_rate: [0.01, 0.1]
      n_estimators: [100, 300]
