# ============================================================================
# PPMI Multimodal Parkinson's Progression Prediction — Phase 1 Configuration
# ============================================================================
# All paths are relative to project root. Never hardcode paths in source code.

seed: 42

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  raw: data/raw
  mri_raw: data/raw/mri
  processed: data/processed
  embeddings: data/embeddings
  results: outputs/results
  figures: outputs/figures
  models: outputs/models
  logs: outputs/logs

# ---------------------------------------------------------------------------
# Embedding dimensions per modality
# ---------------------------------------------------------------------------
embedding_dims:
  clinical: 32
  mri: 64
  pet: 16
  genetic: 32
  fused: 144  # sum of above

# ---------------------------------------------------------------------------
# MRI processing
# ---------------------------------------------------------------------------
mri:
  n_rois: 100            # Schaefer atlas parcels
  use_real_mri: false     # Set true only if NIfTI files successfully downloaded
  fallback_mode: synthetic  # 'synthetic' | 'freesurfer_csv' | 'none'

# ---------------------------------------------------------------------------
# Cross-validation (baselines)
# ---------------------------------------------------------------------------
cv:
  n_splits: 5
  stratify_on: diagnosis

# ---------------------------------------------------------------------------
# Subject-level data split (leak-free: fit statistics on train only)
# ---------------------------------------------------------------------------
split:
  val_fraction: 0.15    # used for round-by-round monitoring + early stopping
  test_fraction: 0.15   # evaluated EXACTLY ONCE, after training completes
  stratify: true        # stratify on diagnosis so PD/HC ratios match

# ---------------------------------------------------------------------------
# Fed-PhenoGraft federated training
# ---------------------------------------------------------------------------
training:
  num_clients: 4
  num_rounds: 30
  local_epochs: 2
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4        # L2 regularization (AdamW)
  hsic_weight: 0.1
  cls_weight: 0.3             # PD-vs-HC classification loss weight (multitask)
  grad_clip: 1.0
  early_stopping_patience: 5  # rounds without val-CCC improvement
  # Client partitioning: 'site' uses real PPMI acquisition sites when a
  # Center-Subject list CSV is in data/raw (falls back to dirichlet otherwise);
  # 'dirichlet' simulates non-IID cross-site heterogeneity via label-skew;
  # 'iid' is the original random-shard split.
  partition: dirichlet
  dirichlet_alpha: 0.5        # lower alpha = more heterogeneous clients

model:
  embed_dim: 32
  num_heads: 4
  dropout: 0.3

# ---------------------------------------------------------------------------
# Statistical rigor: bootstrap CIs, multi-seed runs, paired significance test
# ---------------------------------------------------------------------------
evaluation:
  n_bootstrap: 1000           # bootstrap resamples for 95% CIs
  num_seeds: 3                # independent Fed-PhenoGraft training runs (mean ± std)

# ---------------------------------------------------------------------------
# Ablation suite (each variant retrained with the same protocol)
# ---------------------------------------------------------------------------
ablation:
  enabled: true
  num_rounds: 20              # shorter budget per ablation run
  early_stopping_patience: 3

# ---------------------------------------------------------------------------
# Target variables
# ---------------------------------------------------------------------------
target:
  # 'delta'    → predict UPDRS-III CHANGE from baseline to regression_visit
  #              (progression — harder, clinically more meaningful, avoids
  #              baseline-score autocorrelation dominating the metric)
  # 'absolute' → predict the raw UPDRS-III score at regression_visit
  mode: delta
  regression: updrs_iii_v04       # UPDRS-III score at year 2 (V04)
  classification: diagnosis       # PD vs HC binary label
  regression_visit: V04
  baseline_visit: BL

# ---------------------------------------------------------------------------
# Clinical features (from UPDRS + demographics)
# ---------------------------------------------------------------------------
clinical:
  updrs_cols:
    - updrs_i
    - updrs_ii
    - updrs_iii
    - updrs_iii_a
    - updrs_iv
  extra_behavioral:
    - moca
    - tremor
    - pigd
    - se_adl
    - epworth
    - gds
    - rbd
    - scopa_aut
    - semantic_fluency
    - symbol_digit
    - hvlt_recall
    - hvlt_recognition
    - hvlt_retention
    - lns
    - stai_state
    - stai_trait
    - upsit
  demographic_cols:
    - age
    - gender
    - education

# ---------------------------------------------------------------------------
# PET / DaTscan features
# ---------------------------------------------------------------------------
pet:
  raw_cols:
    - caudate_r
    - caudate_l
    - putamen_r
    - putamen_l
  epsilon: 1.0e-8  # avoid division by zero in asymmetry

# ---------------------------------------------------------------------------
# Genetic features
# ---------------------------------------------------------------------------
genetic:
  target_genes:
    - LRRK2
    - GBA
    - SNCA
    - PINK1
    - PARK2
    - APOE
  explicit_features:
    - n_variants
    - lrrk2_positive
    - gba_positive

# ---------------------------------------------------------------------------
# Autoencoder hyperparameters
# ---------------------------------------------------------------------------
autoencoder:
  clinical:
    hidden_dims: [128, 64]
    bottleneck: 32
    dropout: 0.2
    lr: 0.001
    epochs: 100
    patience: 10
    batch_size: 64
  mri:
    hidden_dims: [256, 128]
    bottleneck: 64
    dropout: 0.2
    lr: 0.001
    epochs: 100
    patience: 10
    batch_size: 32
    l1_lambda: 0.001  # sparse penalty on bottleneck

# ---------------------------------------------------------------------------
# Baseline model hyperparameter grids
# ---------------------------------------------------------------------------
models:
  random_forest:
    n_estimators: 200
    param_grid:
      max_depth: [5, 10, null]
      min_samples_split: [2, 5]

  xgboost:
    n_estimators: 300
    early_stopping_rounds: 20
    param_grid:
      learning_rate: [0.01, 0.1]
      max_depth: [3, 6]

  svm:
    param_grid:
      C: [0.1, 1, 10, 100]
      gamma: ['scale', 'auto']

  ridge:
    alphas: [0.01, 0.1, 1.0, 10.0, 100.0]

  mlp:
    hidden_dims: [256, 128, 64]
    dropout: 0.3
    lr: 0.001
    epochs: 200
    patience: 10
    batch_size: 64

  lightgbm:
    param_grid:
      num_leaves: [31, 63]
      learning_rate: [0.01, 0.1]
      n_estimators: [100, 300]
